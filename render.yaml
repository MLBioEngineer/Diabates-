services:
  - type: web
    name: glycopulse-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: glycopulse-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

databases:
  - name: glycopulse-db
    region: oregon
    plan: free
    databaseName: diabetes_db
    user: diabetes_user
